<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Management System</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb;--panel:#ffffff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;
  --brand:#4f46e5;--brand-soft:#eef2ff;--ok:#059669;--ok-soft:#ecfdf5;--warn:#d97706;--warn-soft:#fffbeb;
  --bad:#dc2626;--bad-soft:#fef2f2;--side:#0b1120;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* Sidebar */
aside{background:var(--side);color:#cbd5e1;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:0 10px 26px}
.brand-name{line-height:1.2}.brand-name small{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-top:2px}
.logo{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#94a3b8;text-decoration:none;font-weight:500;margin-bottom:4px}
nav a:hover{background:#1e293b;color:#fff}
nav a.active{background:#1e293b;color:#fff;box-shadow:inset 3px 0 0 #6366f1}
nav svg{width:18px;height:18px}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;box-shadow:0 0 0 3px #22c55e33}

/* Topbar */
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:20px;margin:0;flex:1}
.input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.key{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.cart-btn{position:relative;background:var(--brand-soft);color:var(--brand);border:0;border-radius:10px;padding:9px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.badge-count{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}

main{padding:26px 28px}
.view{display:none}.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

/* Cards */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
.kpi{background:var(--panel);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center}
.kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.kpi .ic svg{width:22px;height:22px}
.kpi small{color:var(--muted);font-weight:500}
.kpi b{display:block;font-size:24px;margin-top:2px;letter-spacing:-.02em}
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.panel h3{margin:0 0 14px;font-size:15px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}

/* Table */
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);color:var(--ink2)}
tr:hover td{background:#fafbff}
.prod{display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.prod b{color:var(--ink);display:block}.prod span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{background:#f1f5f9;color:var(--ink2);padding:3px 9px;border-radius:6px;font-size:12px;font-weight:500}
.actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn svg{width:16px;height:16px}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}

.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:#4338ca}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.success{background:var(--ok);color:#fff}
.btn.block{width:100%;justify-content:center;padding:12px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted)}

/* Bars */
.bar-row{margin-bottom:14px}
.bar-row .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar{height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#22d3ee);transition:width .6s}
.alert{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--warn-soft);margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:26px}

/* Modal & drawer */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:20}
.overlay.show{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);background:#fff;border-radius:16px;width:min(520px,92vw);padding:24px;z-index:21;display:none;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.show{display:block;transform:translate(-50%,-50%) scale(1)}
.modal h2{margin:0 0 4px;font-size:18px}.modal p{margin:0 0 18px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.form .full{grid-column:1/-1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(400px,94vw);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.show{transform:none}
.drawer header{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer header h2{margin:0;font-size:18px}
.drawer .body{flex:1;overflow:auto;padding:16px 20px}
.drawer footer{padding:20px;border-top:1px solid var(--line)}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .info{flex:1}.ci .info b{display:block}.ci .info span{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;font-size:16px;color:var(--ink2)}
.qty span{min-width:24px;text-align:center;font-weight:600}
.sum{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted)}
.sum.total{color:var(--ink);font-size:18px;font-weight:700;margin:12px 0 16px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:30;display:flex;gap:10px;align-items:center;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--bad)}

@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:none}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.key{display:none}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand"><img class="logo" src="/static/logo.png" alt="Inventory Management System logo"><div class="brand-name">Inventory Management<small>System</small></div></div>
  <nav>
    <a href="#" data-view="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
    <a href="#" data-view="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>Products</a>
    <a href="#" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h10M9 12h10M9 19h10M5 5h.01M5 12h.01M5 19h.01"/></svg>Orders</a>
    <a href="#" onclick="openCart();return false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L22 7H6"/></svg>Cart</a>
  </nav>
  <div class="side-foot"><span class="dot"></span><span id="sys">System healthy</span><br><span style="margin-left:14px">API v1</span></div>
</aside>

<div>
  <div class="top">
    <h1 id="title">Dashboard</h1>
    <input class="input" id="search" placeholder="Search products or SKU…" style="width:260px">
    <label class="key">API key <input class="input" id="key" value="demo-key" style="width:110px"></label>
    <button class="cart-btn" onclick="openCart()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L22 7H6"/></svg>Cart<span class="badge-count" id="cartCount">0</span></button>
  </div>

  <main>
    <!-- Dashboard -->
    <section class="view active" id="v-dashboard">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="panel"><h3>Inventory value by category</h3><div id="catBars"></div></div>
        <div class="panel"><h3>Low stock alerts</h3><div id="alerts"></div></div>
      </div>
      <div class="panel" style="margin-top:18px"><div class="row-between"><h3 style="margin:0">Recent orders</h3><button class="btn ghost" onclick="show('orders')">View all</button></div><div id="recentOrders"></div></div>
    </section>

    <!-- Products -->
    <section class="view" id="v-products">
      <div class="panel">
        <div class="row-between">
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <select class="input" id="catFilter"><option value="">All categories</option></select>
            <select class="input" id="sort">
              <option value="id">Sort: Newest first</option><option value="name">Name A–Z</option>
              <option value="price">Price: low to high</option><option value="-price">Price: high to low</option>
              <option value="quantity">Stock: low to high</option></select>
          </div>
          <button class="btn primary" onclick="openModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>New product</button>
        </div>
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="products"></tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>
    </section>

    <!-- Orders -->
    <section class="view" id="v-orders">
      <div class="panel"><h3>Order history</h3><div id="ordersTable"></div></div>
    </section>
  </main>
</div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="modal" id="modal">
  <h2 id="mTitle">New product</h2><p id="mSub">Add a product to your inventory.</p>
  <form id="form" class="form" onsubmit="saveProduct(event)">
    <input type="hidden" id="pid">
    <label class="full">Product name<input class="input" id="name" required placeholder="e.g. Wireless Headphones"></label>
    <label>SKU<input class="input" id="sku" required placeholder="e.g. HEAD-001"></label>
    <label>Category<input class="input" id="category" list="cats" placeholder="e.g. Electronics"><datalist id="cats"></datalist></label>
    <label>Price (₹)<input class="input" id="price" type="number" min="0" step="0.01" required></label>
    <label>Quantity<input class="input" id="quantity" type="number" min="0" required></label>
    <div class="modal-foot full"><button type="button" class="btn ghost" onclick="closeAll()">Cancel</button><button class="btn primary" id="saveBtn">Save product</button></div>
  </form>
</div>

<!-- Cart drawer -->
<div class="drawer" id="drawer">
  <header><h2>Shopping cart</h2><button class="icon-btn" onclick="closeAll()">✕</button></header>
  <div class="body" id="cartBody"></div>
  <footer>
    <div class="sum"><span>Items</span><span id="cItems">0</span></div>
    <div class="sum"><span>Subtotal</span><span id="cSub">₹0</span></div>
    <div class="sum total"><span>Total</span><span id="cTotal">₹0</span></div>
    <button class="btn success block" onclick="checkout()">Place order</button>
    <button class="btn ghost block" style="margin-top:8px" onclick="api('/cart','DELETE').then(refresh)">Clear cart</button>
  </footer>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const COLORS=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];
const color=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const ICON={
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/>',
  layers:'<path d="M12 2l10 6-10 6L2 8z"/><path d="M2 16l10 6 10-6"/>',
  rupee:'<path d="M6 3h12M6 8h12M6 13l9 8M6 13h3a5 5 0 000-10"/>',
  bag:'<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L22 7H6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'
};
const svg=(k,w=16)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICON[k]}</svg>`;
let page=1, view='dashboard';

function toast(msg,ok=true){const t=$('toast');t.textContent=(ok?'✓  ':'⚠  ')+msg;t.className='show'+(ok?'':' err');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2600)}

async function api(path,method='GET',body){
  const r=await fetch('/api/v1'+path,{method,headers:{'Content-Type':'application/json','X-API-Key':$('key').value},body:body&&JSON.stringify(body)});
  if(r.status===204)return null;
  const d=await r.json();
  if(!r.ok){const m=d.details?Object.entries(d.details).map(([k,v])=>`${k}: ${v}`).join(', '):d.message||d.error;toast(m,false);throw d}
  return d;
}

function status(q){return q===0?'<span class="pill bad">Out of stock</span>':q<10?'<span class="pill warn">Low stock</span>':'<span class="pill ok">In stock</span>'}
function avatar(name){return `<div class="avatar" style="background:${color(name)}">${esc(name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div>`}

/* Views */
function show(v){
  view=v;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id==='v-'+v));
  document.querySelectorAll('nav a[data-view]').forEach(a=>a.classList.toggle('active',a.dataset.view===v));
  $('title').textContent={dashboard:'Dashboard',products:'Products',orders:'Orders'}[v];
  refresh();
}
document.querySelectorAll('nav a[data-view]').forEach(a=>a.onclick=e=>{e.preventDefault();show(a.dataset.view)});

async function loadDashboard(){
  const [s,all,orders]=await Promise.all([api('/stats'),api('/products?per_page=100'),api('/orders')]);
  const k=[['Total products',s.total_products,'box','#6366f1'],['Units in stock',s.total_units.toLocaleString('en-IN'),'layers','#0ea5e9'],
           ['Inventory value',inr(s.inventory_value),'rupee','#10b981'],['Orders placed',s.orders,'bag','#f59e0b']];
  $('kpis').innerHTML=k.map(([l,v,i,c])=>`<div class="kpi"><div class="ic" style="background:${c}1a;color:${c}">${svg(i,22)}</div><div><small>${l}</small><b>${v}</b></div></div>`).join('');
  const cats={};all.items.forEach(p=>cats[p.category]=(cats[p.category]||0)+p.price*p.quantity);
  const max=Math.max(1,...Object.values(cats));
  $('catBars').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar-row"><div class="lbl"><span>${esc(c)}</span><b>${inr(v)}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<div class="empty">No data</div>';
  const low=all.items.filter(p=>p.quantity<10).sort((a,b)=>a.quantity-b.quantity);
  $('alerts').innerHTML=low.map(p=>`<div class="alert"><div class="prod">${avatar(p.name)}<div><b>${esc(p.name)}</b><span>${esc(p.sku)}</span></div></div>${status(p.quantity)}</div>`).join('')||'<div class="empty">All products are well stocked 🎉</div>';
  $('recentOrders').innerHTML=ordersTable(orders.slice(0,5));
}

function ordersTable(o){
  if(!o.length)return '<div class="empty">No orders yet — add items to the cart and place an order.</div>';
  return `<table><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>${o.map(x=>`<tr><td><b style="color:var(--ink)">#ORD-${String(x.id).padStart(4,'0')}</b></td><td>${new Date(x.created_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</td><td>${x.items.map(i=>esc(i.name)+' × '+i.quantity).join(', ')}</td><td><b style="color:var(--ink)">${inr(x.total)}</b></td><td><span class="pill ok">Completed</span></td></tr>`).join('')}</tbody></table>`;
}

async function loadProducts(){
  const q=new URLSearchParams({page,per_page:6,sort:$('sort').value,search:$('search').value});
  if($('catFilter').value)q.set('category',$('catFilter').value);
  const d=await api('/products?'+q);
  $('products').innerHTML=d.items.map(p=>`<tr>
    <td><div class="prod">${avatar(p.name)}<div><b>${esc(p.name)}</b><span>${esc(p.sku)}</span></div></div></td>
    <td><span class="tag">${esc(p.category)}</span></td><td><b style="color:var(--ink)">${inr(p.price)}</b></td>
    <td>${p.quantity} units</td><td>${status(p.quantity)}</td>
    <td><div class="actions">
      <button class="icon-btn" title="Add to cart" onclick="addCart(${p.id})" ${p.quantity?'':'disabled'}>${svg('cart')}</button>
      <button class="icon-btn" title="Edit" onclick='openModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'>${svg('edit')}</button>
      <button class="icon-btn danger" title="Delete" onclick="del(${p.id},'${esc(p.name).replace(/'/g,"\\'")}')">${svg('trash')}</button>
    </div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No products match your search.</td></tr>';
  const from=d.total?(d.page-1)*d.per_page+1:0,to=Math.min(d.page*d.per_page,d.total);
  $('pager').innerHTML=`<span>Showing ${from}–${to} of ${d.total} products</span><div><button class="btn ghost" ${page<=1?'disabled':''} onclick="page--;loadProducts()">← Prev</button> <button class="btn ghost" ${page>=d.pages?'disabled':''} onclick="page++;loadProducts()">Next →</button></div>`;
}

async function loadCategories(){
  const all=await api('/products?per_page=100');
  const cats=[...new Set(all.items.map(p=>p.category))].sort();
  const cur=$('catFilter').value;
  $('catFilter').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  $('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
}

async function loadCart(){
  const c=await api('/cart');
  const n=c.items.reduce((a,i)=>a+i.quantity,0);
  $('cartCount').textContent=n;$('cItems').textContent=n;$('cSub').textContent=inr(c.total);$('cTotal').textContent=inr(c.total);
  $('cartBody').innerHTML=c.items.map(i=>`<div class="ci">${avatar(i.name)}<div class="info"><b>${esc(i.name)}</b><span>${inr(i.unit_price)} each</span></div>
    <div class="qty"><button onclick="setQty(${i.id},${i.quantity-1})">−</button><span>${i.quantity}</span><button onclick="setQty(${i.id},${i.quantity+1})">+</button></div>
    <b style="width:80px;text-align:right">${inr(i.line_total)}</b></div>`).join('')||'<div class="empty">'+svg('cart',40)+'<p>Your cart is empty</p></div>';
}

async function refresh(){
  try{
    loadCart();
    if(view==='dashboard')await loadDashboard();
    if(view==='products'){await loadCategories();await loadProducts()}
    if(view==='orders')$('ordersTable').innerHTML=ordersTable(await api('/orders'));
  }catch(e){}
}

/* Actions */
function setQty(id,q){(q<1?api('/cart/'+id,'DELETE'):api('/cart/'+id,'PUT',{quantity:q})).then(refresh).catch(()=>{})}
function addCart(id){api('/cart','POST',{product_id:id,quantity:1}).then(()=>{toast('Added to cart');refresh()}).catch(()=>{})}
function del(id,name){if(confirm(`Delete "${name}"? This cannot be undone.`))api('/products/'+id,'DELETE').then(()=>{toast('Product deleted');refresh()}).catch(()=>{})}
function checkout(){api('/cart/checkout','POST').then(o=>{toast(`Order #ORD-${String(o.id).padStart(4,'0')} placed — ${inr(o.total)}`);closeAll();refresh()}).catch(()=>{})}
function openCart(){loadCart();$('overlay').classList.add('show');$('drawer').classList.add('show')}
function openModal(p){
  $('form').reset();$('pid').value=p?p.id:'';
  ['name','sku','category','price','quantity'].forEach(k=>{if(p)$(k).value=p[k]});
  $('mTitle').textContent=p?'Edit product':'New product';
  $('mSub').textContent=p?'Update the product details below.':'Add a product to your inventory.';
  $('saveBtn').textContent=p?'Save changes':'Create product';
  $('overlay').classList.add('show');$('modal').classList.add('show');setTimeout(()=>$('name').focus(),50);
}
function closeAll(){['overlay','modal','drawer'].forEach(i=>$(i).classList.remove('show'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
async function saveProduct(e){
  e.preventDefault();
  const id=$('pid').value,body={name:$('name').value.trim(),sku:$('sku').value.trim(),category:$('category').value.trim()||'General',price:+$('price').value,quantity:+$('quantity').value};
  try{await api(id?'/products/'+id:'/products',id?'PUT':'POST',body);toast(id?'Product updated':'Product created');closeAll();refresh()}catch{}
}
let st;$('search').oninput=()=>{clearTimeout(st);st=setTimeout(()=>{page=1;if(view!=='products')show('products');else loadProducts()},250)};
$('sort').onchange=$('catFilter').onchange=()=>{page=1;loadProducts()};

fetch('/health').then(r=>{if(!r.ok)throw 0}).catch(()=>{$('sys').textContent='API unreachable';document.querySelector('.dot').style.background='#ef4444'});
refresh();
</script>
</body>
</html>
