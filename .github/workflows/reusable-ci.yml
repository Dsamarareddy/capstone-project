name: Reusable - CI (lint, test, build)

on:
  workflow_call:
    inputs:
      app_dir:
        description: "Path to the application directory (e.g. app/ims)"
        required: true
        type: string
      python_version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      image_name:
        description: "Docker image name to tag the built image with"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test, and build image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.app_dir }}/requirements*.txt

      - name: Install dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt pytest ruff
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.app_dir }}
          push: false
          tags: ${{ inputs.image_name }}:ci-${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ inputs.image_name }}-image.tar

      - name: Upload built image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image_name }}-image
          path: /tmp/${{ inputs.image_name }}-image.tar
          retention-days: 3
