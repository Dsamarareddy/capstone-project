name: Reusable - Security Scan (Gitleaks, Trivy, Checkov)

on:
  workflow_call:
    inputs:
      app_dir:
        description: "Path to the application directory to scan for dependency vulnerabilities"
        required: true
        type: string
      image_name:
        description: "Docker image name/tag built by reusable-ci.yml to scan"
        required: true
        type: string
      terraform_dir:
        description: "Path to Terraform code to scan with Checkov (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  dependency-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.app_dir }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload Trivy fs results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif
          retention-days: 7

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_name }}-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/${{ inputs.image_name }}-image.tar

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image_name }}:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload Trivy image results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-results
          path: trivy-image-results.sarif
          retention-days: 7

  terraform-scan:
    name: Checkov IaC scan
    if: inputs.terraform_dir != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.terraform_dir }}
          framework: terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.sarif
          retention-days: 7
